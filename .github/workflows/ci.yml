name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · knip · test
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Next.js app lives in cfos-office/; all scripts run from there.
        working-directory: cfos-office
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cfos-office/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (incl. cfo/visual-token guards)
        run: npm run lint

      - name: Knip (unused files / deps)
        run: npm run knip

      # Hermetic: `vitest run` only collects *.test.ts(x) (src + tests/benchmark +
      # tests/onboarding/unit). It does NOT launch the onboarding e2e runner (that
      # is run via tsx and needs Staging + Bedrock), so no secrets are required here.
      - name: Unit + integration tests
        run: npm test
